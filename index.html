<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alchemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #171029;
    --ink-2: #211a3a;
    --panel: #251d42;
    --panel-2: #2d2451;
    --line: #3d3268;
    --gold: #c9a24b;
    --gold-bright: #e3c274;
    --parchment: #ece2c6;
    --teal: #6fb3a8;
    --red: #c9634b;
    --text: #ece7f3;
    --text-dim: #a89ec7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a2150 0%, var(--ink) 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{ width:100%; max-width:600px; }
  header{ text-align:center; margin-bottom:22px; }
  .glyph-row{ font-size:20px; letter-spacing:10px; color:var(--gold); opacity:0.7; margin-bottom:6px; }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700; font-size:44px; margin:0;
    color:var(--parchment); letter-spacing:1px;
  }
  .subtitle{ font-size:13px; color:var(--text-dim); margin-top:4px; }
  .date-line{ font-size:12px; color:var(--gold); margin-top:10px; font-variant:small-caps; letter-spacing:0.5px; }

  .target-card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .target-card::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, rgba(201,162,75,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .target-label{ font-size:11px; color:var(--text-dim); margin-bottom:8px; }
  .target-name{
    font-family:'Cormorant Garamond', serif;
    font-size:32px; font-weight:700;
    color:var(--gold-bright);
    display:flex; align-items:center; gap:10px;
  }
  .target-name .icon{ font-size:36px; }
  .target-name.hidden-target{ color:var(--text-dim); }

  .hints{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .hint-row{
    font-size:12.5px;
    color:var(--teal);
    background:rgba(111,179,168,0.08);
    border:1px solid rgba(111,179,168,0.25);
    border-radius:8px;
    padding:6px 10px;
  }
  .hint-locked{
    font-size:12px;
    color:var(--text-dim);
    opacity:0.55;
    padding:6px 10px;
  }

  .tries-row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .flasks{ display:flex; gap:5px; flex-wrap:wrap; max-width:70%; }
  .flask{ width:14px;height:14px; border-radius:3px 3px 7px 7px; border:1.5px solid var(--gold); background:transparent; }
  .flask.used{ background:var(--red); border-color:var(--red); opacity:0.85; }
  .tries-text{ font-size:12px; color:var(--text-dim); white-space:nowrap; }

  .section-title{ font-size:12px; color:var(--text-dim); margin:22px 0 10px 2px; }

  .combine-zone{
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:6px; flex-wrap:wrap;
  }
  .slot{
    width:84px;height:84px; border-radius:12px; border:2px dashed var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:28px; color:var(--text-dim); background:var(--ink-2); cursor:pointer;
    transition:border-color .15s ease;
  }
  .slot.filled{ border-style:solid; border-color:var(--gold); color:var(--text); }
  .slot .slot-name{ font-size:10px; margin-top:4px; color:var(--text-dim); }
  .plus{ font-size:22px; color:var(--gold); }
  .combine-btn{
    font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:600;
    background:var(--gold); color:#231a3f; border:none; border-radius:10px;
    padding:10px 18px; cursor:pointer; transition:transform .1s ease, background .15s ease;
  }
  .combine-btn:disabled{ background:var(--line); color:var(--text-dim); cursor:not-allowed; }
  .combine-btn:not(:disabled):hover{ background:var(--gold-bright); }
  .combine-btn:not(:disabled):active{ transform:scale(0.97); }

  .message{ text-align:center; min-height:20px; font-size:13px; color:var(--teal); margin:10px 0 4px; }
  .message.error{ color:var(--red); }

  .filter-row{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;
  }
  .filter-chip{
    font-size:11px; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--text-dim); cursor:pointer; background:transparent;
  }
  .filter-chip.active{ border-color:var(--gold); color:var(--gold-bright); background:rgba(201,162,75,0.1); }

  .inventory{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(78px,1fr)); gap:8px;
    max-height:340px; overflow-y:auto; padding-right:2px;
  }
  .item{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 6px; text-align:center; cursor:pointer;
    transition:border-color .15s ease, background .15s ease; user-select:none;
  }
  .item:hover{ border-color:var(--gold); }
  .item.selected{ border-color:var(--gold-bright); background:var(--panel-2); }
  .item .icon{ font-size:24px; display:block; }
  .item .name{ font-size:11px; color:var(--text-dim); margin-top:4px; }

  .win-panel, .fail-panel{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--gold);
    border-radius:14px; padding:22px; text-align:center; margin-top:18px;
  }
  .fail-panel{ border-color:var(--red); }
  .win-panel h2{ font-family:'Cormorant Garamond', serif; font-size:28px; color:var(--gold-bright); margin:0 0 6px; }
  .fail-panel h2{ font-family:'Cormorant Garamond', serif; font-size:26px; color:var(--red); margin:0 0 8px; }
  .win-stats{ display:flex; justify-content:center; gap:26px; margin:16px 0; }
  .win-stat .num{ font-family:'Cormorant Garamond', serif; font-size:28px; color:var(--parchment); font-weight:700; }
  .win-stat .lbl{ font-size:11px; color:var(--text-dim); }
  .share-btn{
    background:transparent; border:1px solid var(--gold); color:var(--gold-bright);
    font-size:13px; padding:9px 16px; border-radius:9px; cursor:pointer;
  }
  .share-btn:hover{ background:rgba(201,162,75,0.12); }

  .loading{ text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0; }

  .codex-toggle-row{ display:flex; justify-content:center; margin-top:18px; }
  .codex-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    font-size:12.5px; padding:8px 16px; border-radius:9px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .codex-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

  .codex-overlay{
    position:fixed; inset:0; background:rgba(10,7,20,0.72);
    display:flex; align-items:flex-start; justify-content:center;
    padding:28px 14px; z-index:50; overflow-y:auto;
  }
  .codex-panel{
    background:var(--ink-2); border:1px solid var(--line); border-radius:16px;
    max-width:640px; width:100%; padding:22px; margin-bottom:40px;
  }
  .codex-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .codex-head h2{
    font-family:'Cormorant Garamond', serif; font-size:26px; color:var(--parchment); margin:0;
  }
  .codex-close{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  .codex-close:hover{ border-color:var(--red); color:var(--red); }
  .codex-warning{
    font-size:12px; color:var(--text-dim); background:rgba(201,162,75,0.08);
    border:1px solid rgba(201,162,75,0.25); border-radius:8px; padding:8px 10px; margin:10px 0 14px;
  }
  .codex-controls{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .codex-search{
    flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .codex-search:focus{ outline:none; border-color:var(--gold); }
  .codex-tier{ margin-bottom:16px; }
  .codex-tier-title{
    font-size:11px; color:var(--gold); text-transform:none; margin-bottom:8px;
    padding-bottom:4px; border-bottom:1px solid var(--line);
  }
  .codex-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:8px;
  }
  .codex-item{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 6px; text-align:center; position:relative;
  }
  .codex-item.found{ border-color:var(--gold); }
  .codex-item .icon{ font-size:22px; display:block; }
  .codex-item.locked .icon{ filter:grayscale(1) brightness(0.5); }
  .codex-item .name{ font-size:10.5px; color:var(--text-dim); margin-top:4px; }
  .codex-item.locked .name{ color:#5c5480; }
  .codex-item .cat-tag{
    display:block; font-size:8.5px; color:var(--text-dim); margin-top:2px;
  }
  .codex-empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:20px; }
  .codex-progress{ font-size:12px; color:var(--text-dim); margin-bottom:12px; }

  .kitty-zone{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    margin-top:44px;
    padding-top:10px;
  }
  .sign-post{
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:rotate(-6deg);
  }
  .sign-board{
    background:#8a5a34;
    border:3px solid #5e3a1e;
    border-radius:4px;
    padding:10px 14px;
    box-shadow:2px 3px 0 rgba(0,0,0,0.35);
    position:relative;
  }
  .sign-board::before, .sign-board::after{
    content:"";
    position:absolute;
    width:6px; height:6px;
    background:#3f2712;
    border-radius:50%;
    top:6px;
  }
  .sign-board::before{ left:6px; }
  .sign-board::after{ right:6px; }
  .sign-text{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:15px;
    color:#f3e6c8;
    text-align:center;
    line-height:1.25;
    letter-spacing:0.5px;
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
    transform:rotate(0.6deg);
  }
  .sign-arrow{
    margin-top:2px;
    font-size:22px;
    color:#f3e6c8;
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
    transform:rotate(20deg);
  }
  .sign-stick{
    width:8px;
    height:38px;
    background:linear-gradient(90deg,#6b4321,#8a5a34,#6b4321);
    border-radius:2px;
    margin-top:-2px;
  }
  .kitty-photo{
    width:150px;
    border-radius:10px;
    border:3px solid var(--line);
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    transform:rotate(3deg);
  }

  .codex-secret-btn{
    position:absolute;
    bottom:8px;
    left:8px;
    width:60px;
    height:60px;
    background:transparent;
    border:none;
    cursor:default;
    padding:0;
  }
  .lock-overlay{
    position:fixed; inset:0; background:rgba(10,7,20,0.8);
    display:flex; align-items:center; justify-content:center;
    z-index:60; padding:20px;
  }
  .lock-panel{
    background:var(--ink-2); border:1px solid var(--gold); border-radius:14px;
    padding:24px; text-align:center; max-width:280px; width:100%;
  }
  .lock-panel h3{
    font-family:'Cormorant Garamond', serif; font-size:20px; color:var(--gold-bright); margin:0 0 4px;
  }
  .lock-sub{ font-size:12px; color:var(--text-dim); margin-bottom:16px; }
  .lock-digits{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .lock-digit{
    width:42px; height:52px; text-align:center; font-size:22px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:'Cormorant Garamond', serif;
  }
  .lock-digit:focus{ outline:none; border-color:var(--gold); }
  .lock-error{ font-size:12px; color:var(--red); min-height:16px; margin-bottom:8px; }
  .lock-buttons{ display:flex; gap:8px; justify-content:center; }
  .lock-cancel{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    font-size:13px; padding:8px 14px; border-radius:8px; cursor:pointer;
  }
</style>
</head>

</div>

  const RIDDLES = {"Fire":"I dance in orange and gold, but grab me and you'll let go.","Water":"I have no shape of my own, yet I carve canyons of stone.","Earth":"I hold up every tree and town, yet no one thanks the ground.","Air":"You cannot see me, yet without me you'd last only minutes.","Steam":"I rise when water gets too hot to sit still.","Lava":"I flow like a river, but I'm made of melted rock.","Energy":"I make things move, glow, and grow, but you can't hold me.","Mud":"Mix dirt with rain and you'll find me underfoot.","Rain":"I fall from clouds and fill up rivers.","Dust":"I settle on shelves when no one's cleaning.","Cloud":"I float in the sky and sometimes cry.","Geyser":"I'm a fountain built by heat trapped underground.","Obsidian":"Cool lava fast and I'm the glassy black result.","Ash":"After the fire dies, I'm the gray remains.","Volcano":"I'm a mountain that occasionally loses my temper.","Storm":"I bring wind, rain, and sometimes thunder all at once.","Life":"Plants, animals, and people all share this spark.","Lightning":"I flash across the sky faster than sound.","Brick":"Bake clay in a kiln and stack me into walls.","Swamp":"I'm a wetland thick with mud and mystery.","Clay":"Wet and moldable, I become pottery when fired.","Plant":"I grow roots, leaves, and reach for the sun.","Wind":"You can't see me, but you can feel me push.","Sandstorm":"I'm a desert wind carrying grit for miles.","Mineral":"Dig deep enough and you'll find me in the rock.","Sky":"I stretch above you, blue by day and dark by night.","Fog":"I hug the ground and hide the road ahead.","Rainbow":"After a storm, I arc across the sky in color.","Mountain":"I'm the tallest thing for miles, capped in snow.","Metal":"Melted from ore, I can become a sword or a spoon.","Sand":"Grains of me make up every beach.","Soap":"Rub me with water and watch bubbles form.","Smoke":"I curl upward whenever something burns.","Coal":"Buried for ages, I burn black and hot.","Island":"I'm land completely surrounded by water.","Flood":"Too much rain and I swallow the streets.","Wave":"I roll toward the shore and crash before I stop.","Fish":"I breathe through gills and swim all day.","Bird":"I have feathers and usually take to the sky.","Grass":"I carpet the ground in green and need mowing.","Sound":"I travel in waves and you catch me with your ears.","Electricity":"I flow through wires and power your lights.","Wall":"Stack enough bricks and I'll keep you separated.","House":"Walls and a roof make me a place to live.","Charcoal":"Burn wood without enough air and you'll get me.","Frog":"I hop between land and water, croaking as I go.","Pottery":"Shaped from clay and hardened by fire, I hold your soup.","Ceramic":"Fired clay, glazed smooth, found in kitchens everywhere.","Tree":"I start as a seed and end up taller than a house.","Waterfall":"I'm a river that suddenly forgets to be flat.","Canyon":"Rivers carved me over millions of years.","Mirror":"Look at me and you'll see yourself looking back.","Crystal":"I form in neat geometric shapes, sometimes clear as glass.","River":"I flow from mountain to sea, never quite still.","Cave":"Dark, damp, and hidden inside a mountain.","Sword":"Sharp, long, and once carried into battle.","Rust":"Leave metal out in the rain and I'll show up.","Bronze":"An old alloy, once used for statues and coins.","Beach":"Sand meets sea right where I sit.","Diamond":"Squeeze carbon hard enough for long enough and you get me.","Star":"I twinkle at night, though I'm really a distant sun.","Sun":"I rise every morning and set every night.","Moon":"I glow at night, but only by borrowed light.","Reef":"Colorful and underwater, I'm built by tiny creatures.","Ocean":"I cover most of the planet in salt water.","Jungle":"Thick, green, and humid, I'm home to countless creatures.","Valley":"I sit low between two hills or mountains.","Seed":"Plant me and, given time, I'll become something bigger.","Steel":"Mix iron with carbon and you get something stronger."," y breath.","Acid":"Sour and reactive, I can dissolve things you'd rather I didn't.","Alcohol":"Ferment fruit or grain long enough and you'll produce me.","Vinegar":"Sour and sharp, I'm great on salads and in cleaning.","Petroleum":"Pumped from underground, I'm refined into fuel.","Gasoline":"Pour me into a tank and a car will run.","Plastic":"Molded into countless shapes, I take centuries to break down.","Rubber":"Stretchy and bouncy, I'm found in tires.","Alloy":"Mix two metals together and you'll get something like me.","Pressure":"Squeeze hard enough and you'll feel me build.","Smog":"A city's dirty air on a still day.","Poison":"Handle me with care - I can do real harm.","Fossil":"Bones turned to stone over millions of years.","Dinosaur":"Long extinct, I once ruled the earth on giant legs.","Continent":"A vast stretch of land surrounded by ocean.","Space":"Dark, vast, and mostly empty, I stretch beyond the sky.","Rocket":"Light my engines and I'll leave the atmosphere behind.","Astronaut":"I train for years just to float in zero gravity.","Satellite":"I orbit the planet, relaying signals below.","Planet":"Round, orbiting a star, and sometimes home to life.","Comet":"I streak across the sky with a glowing tail.","Galaxy":"A swirl of billions of stars, held together by gravity.","Meteor":"I burn up in a flash the moment I hit the atmosphere.","Asteroid":"A chunk of rock drifting through space, sometimes too close for comfort.","Black Hole":"Nothing escapes me, not even light.","Desert":"Dry, sandy, and stretching for miles with barely a drop of rain.","Blizzard":"A snowstorm with wind so strong you can't see ahead.","Hail":"Ice falls from the sky and dents your car.","Cement":"Mix me with water and I harden into something solid.","Cow":"I graze in fields and give milk every morning.","Sheep":"Woolly and gentle, I graze in flocks.","Pig":"Pink, round, and happiest rolling in mud.","Chicken":"I lay eggs and cluck around the farmyard.","Dog":"Loyal and eager, I've been man's best friend for ages.","Farm":"Fields, barns, and animals all working together.","Wheat":"Golden stalks that get ground into flour.","Bread":"Bake flour and water together and you'll get me.","Milk":"White and creamy, I come from a cow every morning.","Cheese":"Age milk long enough and you'll end up with me.","Apple":"Red or green, I grow on trees and keep doctors away.","Wine":"Ferment grapes long enough and you'll get this drink.","Soup":"Warm, liquid, and served in a bowl on a cold day.","Sugar":"Sweet and white, I dissolve right into your tea.","Cake":"Bake me for a birthday and top me with icing.","Honey":"Sweet and golden, bees make me from flower nectar.","Beer":"Brewed from grain, this drink comes with foam on top.","Tea":"Steep dried leaves in hot water and sip me slowly.","Owl":"I hunt at night and can turn my head almost all the way around.","Bear":"Big, furry, and fond of fish and honey.","Cat":"I purr, I nap, and I always land on my feet.","Tiger":"Orange with black stripes, I'm the biggest of the big cats.","Dolphin":"Playful and smart, I leap through ocean waves.","Whale":"The largest animal in the ocean, I breathe through a blowhole.","Shark":"Rows of teeth and a fin that cuts the surface.","Ant":"Small, strong, and always marching in a line.","Rope":"Twist fibers together and I'll hold almost anything.","Spider":"Eight legs and a web spun from silk.","Rabbit":"Long ears, a fluffy tail, and a love of carrots.","Deer":"Graceful and quick, I bound through the forest.","Fox":"Clever and quick, with a bushy tail and pointed ears.","Turtle":"Slow and steady, I carry my home on my back.","Camel":"I store fat in my hump and cross deserts with ease.","Elephant":"The largest land animal, with a trunk and huge ears.","Bat":"I sleep upside down and hunt using echoes.","Duck":"I waddle on land but glide smoothly on water.","Goat":"I'll climb almost anything and eat almost everything.","Cloth":"Woven from thread, I become shirts and curtains.","Thread":"Thin and twisted, sew me through fabric.","Basket":"Woven from reeds, I carry your groceries.","Needle":"Thin and sharp, I pull thread through fabric.","Hammer":"Swing me down and the nail goes in.","Nail":"Hammer me into wood and I'll hold things together.","Saw":"Back and forth I go, cutting through wood.","Pencil":"Sharpen my tip and I'll write in gray.","Letter":"Fold me up, seal me, and send me by mail.","Telescope":"Point me at the sky and the stars come closer.","Camera":"Click my shutter and the moment is frozen forever.","Radio":"Turn my dial and music comes out of nowhere.","Computer":"Type on my keys and the screen lights up.","Robot":"Built from metal and wires, I follow instructions exactly.","Battery":"Small and powerful, I store energy until you need it.","Engine":"Burn fuel inside me and something starts to move.","Train":"I run on rails and pull cars behind me.","Car":"Four wheels, an engine, and a place to sit.","Airplane":"Wings and engines let me soar above the clouds.","Balloon":"Fill me with air or gas and I'll float or pop.","Umbrella":"Open me up and the rain won't touch you.","Kite":"Tie a string to me and let the wind carry me up.","Sail":"Catch the wind in me and the boat moves forward.","Net":"Woven with holes, I'm great for catching fish.","Ladder":"Climb my rungs to reach somewhere higher.","Scissors":"Two blades that cross to cut paper or hair.","Castle":"Stone walls and towers built to keep invaders out.","Village":"A small cluster of homes where everyone knows each other.","City":"Skyscrapers, streets, and crowds as far as you can see.","Windmill":"My blades spin in the wind to grind grain or make power.","Well":"Dig deep enough into the ground and you'll find water in me.","Fence":"I mark the edge of a yard and keep animals in.","Barn":"Red and wooden, I shelter animals and hay.","Church":"A steeple, pews, and quiet on Sunday morning.","School":"Desks, chalkboards, and the sound of a bell between classes.","Library":"Rows of shelves, all filled with books to borrow.","Palace":"Grand and gilded, built for royalty to live in.","Lighthouse":"Tall by the sea, I flash light to guide ships home.","Pyramid":"Ancient and triangular, built from stone blocks in the desert.","Temple":"A sacred building where people come to worship.","Dream":"Vivid and strange, I only visit while you sleep.","Shadow":"I follow you everywhere the sun shines.","King":"I wear a crown and rule over a kingdom.","Queen":"I wear a crown too, and often rule beside a king.","Knight":"Armored and sworn to duty, I once rode into battle for my king.","Soldier":"Trained and disciplined, I serve in an army.","Army":"A large group of soldiers ready for battle.","War":"Conflict between nations, fought with soldiers and weapons.","Peace":"The calm that follows when the fighting finally stops.","Love":"A deep feeling of care that connects two people.","Money":"Coins and bills that let you buy what you need.","Market":"Stalls and shoppers gathered to buy and sell goods.","Human":"Two legs, a big brain, and the only one reading this.","Glass":"Melt sand hot enough and I turn clear and breakable.","Lamp":"Flip my switch and light fills the room.","Bridge":"I stretch across a river so you don't need a boat.","Salt":"White, crunchy, and pulled from seawater or mines.","Coral":"Colorful and hard, I build reefs one tiny creature at a time.","Bee":"I buzz between flowers and make honey back home.","Wolf":"I howl at night and hunt in a pack.","Time":"You can't stop me, save me, or get me back.","Gold":"Shiny, heavy, and worth a fortune by the ounce.","Music":"Notes and rhythm combined into something you can hum.","Lion":"King of the savanna, with a mane and a roar.","Horse":"Strong and fast, I've carried riders for thousands of years.","Supernova":"A dying star explodes in the brightest blast the sky can offer.","Neutron Star":"Crush a dead star tight enough and I'm denser than anything on Earth.","White Dwarf":"A star burned out, cooling slowly in   function computeDepths(){
    const depth = {"Fire":0,"Water":0,"Earth":0,"Air":0};

    let d = 0;
    while (frontier.size && d < 12) {

      const next = new Set();
      const arr = Array.from(known);
      for (let i=0;i<arr.length;i++) for (let j=i;j<arr.length;j++) {
        const key = [arr[i],arr[j]].sort().join("+");
        const r = RECIPES[key];
        if (r && !known.has(r)) next.add(r);
      }
      next.forEach(item => { if(!(item in depth)) depth[item]=d; });
      next.forEach(item => known.add(item));
      frontier = next;
    }
    return depth;
  }

    document.getElementById("slotA").onclick = () => { if(slotA){ slotA=null; render(); } };
    document.getElementById("slotB").onclick = () => { if(slotB){ slotB=null; render(); } };
    const combineBtn = document.getElementById("combineBtn");
    if(combineBtn) combineBtn.onclick = () => { if(slotA && slotB) tryCombine(slotA, slotB); };
    document.querySelectorAll(".item").forEach(el=>{
      el.onclick = () => selectItem(el.getAttribute("data-name"));
    });
    document.querySelectorAll(".filter-chip").forEach(el=>{
      el.onclick = () => { activeFilter = el.getAttribute("data-cat"); render(); };
    });

    const shareBtn = document.getElementById("shareBtn");
    if(shareBtn){
      shareBtn.onclick = async () => {
        const text = buildShareText();
        try{
          await navigator.clipboard.writeText(text);
          shareBtn.textContent = "Copied!";
          setTimeout(()=>{ shareBtn.textContent = "Copy result"; }, 1500);
        }catch(e){
          shareBtn.textContent = "Copy failed";
        }
      };
    }

    if(state.won){
      getStats().then(stats=>{
        const el = document.getElementById("streakNum");
        if(el) el.textContent = stats.streak || 1;
      });
    }

    const codexOpenBtn = document.getElementById("codexOpenBtn");
    if(codexOpenBtn) codexOpenBtn.onclick = () => { showCodex = true; render(); };

    const codexOverlay = document.getElementById("codexOverlay");
    if(codexOverlay){
      codexOverlay.onclick = (e) => { if(e.target === codexOverlay){ showCodex = false; render(); } };
      const closeBtn = document.getElementById("codexCloseBtn");
      if(closeBtn) closeBtn.onclick = () => { showCodex = false; render(); };
      const searchInput = document.getElementById("codexSearchInput");
      if(searchInput){
        searchInput.focus();
        searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
        searchInput.oninput = (e) => { codexSearch = e.target.value; render(); };
      }
      const secretBtn = document.getElementById("codexSecretBtn");
      if(secretBtn) secretBtn.onclick = () => { showLock = true; lockError = ""; render(); };
      document.querySelectorAll("[data-codexcat]").forEach(el => {
        el.onclick = () => { codexCategoryFilter = el.getAttribute("data-codexcat"); render(); };
      });
    }

    const lockOverlay = document.getElementById("lockOverlay");
    if(lockOverlay){
      const digits = [0,1,2,3].map(i => document.getElementById("lockDigit"+i));
      digits[0].focus();
      digits.forEach((el, i) => {
        el.oninput = () => {
          el.value = el.value.replace(/[^0-9]/g,"").slice(0,1);
          if(el.value && digits[i+1]) digits[i+1].focus();
        };
        el.onkeydown = (e) => {
          if(e.key === "Backspace" && !el.value && digits[i-1]) digits[i-1].focus();
        };
      });
      document.getElementById("lockCancelBtn").onclick = () => { showLock = false; render(); };
      document.getElementById("lockSubmitBtn").onclick = () => {
        const code = digits.map(d => d.value).join("");
        if(code === SECRET_CODE){
          codexRevealAll = true;
          showLock = false;
          lockError = "";
        } else {
          lockError = "Incorrect combination.";
        }
        render();
      };
    }
  }

  loadProgress();
})();
